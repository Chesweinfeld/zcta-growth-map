name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # enablement: true turns Pages on via the API using this workflow's
      # pages: write permission, so the repo does not have to be clicked through
      # in Settings first. Without it this step fails on a repo where Pages has
      # never been enabled.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Publishes web/ as the site root. The sidecar data is committed and the
      # tiles are hosted off-repo (see TILES_URL in web/config.js), so there is
      # nothing to build here - the Python pipeline runs locally.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
